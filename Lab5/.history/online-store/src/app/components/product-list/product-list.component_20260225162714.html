<div class="page">
  <h1>Online Store</h1>
  <p class="sub">Каталог реальных товаров с Kaspi.kz</p>

  <div class="grid">
<app-product-item
  *ngFor="let p of filteredProducts"
  [product]="p"
  (delete)="deleteProduct($event)">
</app-product-item>
  </div>
</div>

<button class="like-btn" (click)="like()">
  <span [class.active]="liked">❤</span>
  {{ likesCount }}
</button>
